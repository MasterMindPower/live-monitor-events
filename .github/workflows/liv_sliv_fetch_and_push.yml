name: Fetch & Push LIV-SLIV Cookies

on:
  schedule:
    # Runs daily at 12:30 AM IST (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  run-liv-sliv-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Decrypt & Run LIV-SLIV Extractor
        env:
          LIV_SLIV_DECRYPT_KEY: ${{ secrets.LIV_SLIV_DECRYPT_KEY || secrets.DECRYPT_KEY }}
        run: |
          python liv-sliv/loader.py

      - name: Push Cookies to Private Repository
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          TARGET_PRIVATE_REPO: ${{ secrets.TARGET_PRIVATE_REPO }}
          TARGET_BRANCH: ${{ secrets.TARGET_BRANCH || 'main' }}
        run: |
          set +x
          echo "::add-mask::${PRIVATE_REPO_PAT}"
          echo "::add-mask::${TARGET_PRIVATE_REPO}"

          COOKIE_SRC=""
          if [ -f "liv-sliv-cookies.json" ]; then
            COOKIE_SRC="liv-sliv-cookies.json"
          elif [ -f "liv-sliv/liv-sliv-cookies.json" ]; then
            COOKIE_SRC="liv-sliv/liv-sliv-cookies.json"
          else
            echo "::error::liv-sliv-cookies.json was not generated."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --quiet "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${TARGET_PRIVATE_REPO}.git" target_private_repo > /dev/null 2>&1 || {
            echo "::error::Failed to connect to private repository. Verify permissions and PAT."
            exit 1
          }

          cd target_private_repo

          # Copy liv-sliv-cookies.json to target repository
          cp "../${COOKIE_SRC}" ./liv-sliv-cookies.json
          git add liv-sliv-cookies.json

          if git diff --staged --quiet; then
            echo "No changes detected in liv-sliv-cookies.json. Skipping push."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --quiet -m "Auto-update LIV-SLIV cookies [${TIMESTAMP}]"
            git push --quiet origin HEAD > /dev/null 2>&1 || {
              echo "::error::Failed to push updates to private repository."
              exit 1
            }
            echo "Successfully updated and synced liv-sliv-cookies.json to private repository."
          fi
