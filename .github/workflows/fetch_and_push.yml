name: Fetch & Push Playlist

on:
  schedule:
    - cron: '30 0-19 * * *'
  workflow_dispatch:

jobs:
  run-fetcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Public Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Decrypt & Run Playlist Fetcher
        env:
          DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        run: |
          python loader.py

      - name: Push Playlist to Private Repository
        env:
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
          TARGET_PRIVATE_REPO: ${{ secrets.TARGET_PRIVATE_REPO }}
          TARGET_BRANCH: ${{ secrets.TARGET_BRANCH || 'main' }}
        run: |
          set +x
          echo "::add-mask::${PRIVATE_REPO_PAT}"
          echo "::add-mask::${TARGET_PRIVATE_REPO}"

          if [ ! -f "live-event.m3u" ] && [ ! -f "Playlist.m3u" ] && [ ! -f "raw_playlist.m3u" ]; then
            echo "::error::Playlists were not generated."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --quiet "https://x-access-token:${PRIVATE_REPO_PAT}@github.com/${TARGET_PRIVATE_REPO}.git" target_private_repo > /dev/null 2>&1 || {
            echo "::error::Failed to connect to private repository. Verify permissions and PAT."
            exit 1
          }

          cd target_private_repo

          if [ -f "../live-event.m3u" ]; then
            cp ../live-event.m3u ./live-event.m3u
            git add live-event.m3u
          elif [ -f "../Playlist.m3u" ]; then
            cp ../Playlist.m3u ./live-event.m3u
            git add live-event.m3u
          fi

          if [ -f "../Playlist.m3u" ]; then
            cp ../Playlist.m3u ./Playlist.m3u
            git add Playlist.m3u
          fi

          if [ -f "../raw_playlist.m3u" ]; then
            cp ../raw_playlist.m3u ./raw_playlist.m3u
            git add raw_playlist.m3u
          fi

          if [ -f "../live-cookies.json" ]; then
            cp ../live-cookies.json ./live-cookies.json
            git add live-cookies.json
          fi

          if git diff --staged --quiet; then
            echo "No changes detected in playlists. Skipping push."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit --quiet -m "Auto-update playlists [${TIMESTAMP}]"
            git push --quiet origin HEAD > /dev/null 2>&1 || {
              echo "::error::Failed to push updates to private repository."
              exit 1
            }
            echo "Successfully updated and synced playlists to private repository."
          fi
